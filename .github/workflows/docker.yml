name: 构建 Docker 镜像

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'flutter/**'
      - 'png/**'
      - '.github/workflows/build*.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      push_latest:
        description: '推送 latest 标签'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===== 阶段1: 交叉编译二进制 =====
  build-binaries:
    name: 编译 ${{ matrix.platform.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: 安装 Zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: 安装 cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: 编译二进制
        id: build
        run: |
          cargo zigbuild --release --target ${{ matrix.platform.target }} --features web 2>&1 | tee build.log || {
            echo "BUILD_FAILED=true" >> $GITHUB_OUTPUT
            # 提取最后 50 行错误输出到 GitHub Actions 注解
            tail -50 build.log | while IFS= read -r line; do
              echo "::error::${line:0:500}"
            done
            exit 1
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: cfnat-${{ matrix.platform.arch }}
          path: target/${{ matrix.platform.target }}/release/CFnat
          retention-days: 1

  # ===== 阶段2: 构建 Docker 镜像 =====
  build-and-push:
    name: 构建并推送 Docker 镜像
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 amd64 二进制
        uses: actions/download-artifact@v4
        with:
          name: cfnat-amd64
          path: binaries/amd64

      - name: 下载 arm64 二进制
        uses: actions/download-artifact@v4
        with:
          name: cfnat-arm64
          path: binaries/arm64

      - name: 设置二进制权限
        run: |
          chmod +x binaries/amd64/CFnat binaries/arm64/CFnat

      - name: 设置 QEMU（多架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || inputs.push_latest == true }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
