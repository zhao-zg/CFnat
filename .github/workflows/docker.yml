name: 构建 Docker 镜像

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'flutter/**'
      - 'png/**'
      - '.github/workflows/build*.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      push_latest:
        description: '推送 latest 标签'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: 编译并构建 Docker 镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: 安装 Zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: 安装 cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: 更新依赖锁文件
        run: cargo update

      - name: 编译 amd64 二进制
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-musl --features web
          mkdir -p binaries/amd64
          cp target/x86_64-unknown-linux-musl/release/CFnat binaries/amd64/CFnat
          chmod +x binaries/amd64/CFnat
          ls -lh binaries/amd64/CFnat

      - name: 编译 arm64 二进制
        run: |
          cargo zigbuild --release --target aarch64-unknown-linux-musl --features web
          mkdir -p binaries/arm64
          cp target/aarch64-unknown-linux-musl/release/CFnat binaries/arm64/CFnat
          chmod +x binaries/arm64/CFnat
          ls -lh binaries/arm64/CFnat

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || inputs.push_latest == true }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
