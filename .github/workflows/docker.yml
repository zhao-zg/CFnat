name: 构建 Docker 镜像

retention-days: 1

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'flutter/**'
      - 'png/**'
      - '.github/workflows/build*.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      cfnat_version:
        description: '上游 CFnat Release 标签 (默认 main-latest)'
        type: string
        default: 'main-latest'
      push_latest:
        description: '推送 latest 标签'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  UPSTREAM_REPO: GuangYu-yu/CFnat

jobs:
  build-and-push:
    name: 下载二进制并构建 Docker 镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确定 Release 标签
        id: release
        run: |
          TAG="${{ inputs.cfnat_version || 'main-latest' }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "使用上游 Release: $TAG"

      - name: 下载 amd64 二进制
        run: |
          mkdir -p binaries/amd64
          curl -fSL -o cfnat_amd64.tar.gz \
            "https://github.com/${{ env.UPSTREAM_REPO }}/releases/download/${{ steps.release.outputs.tag }}/CFnat_linux_amd64.tar.gz"
          tar xzf cfnat_amd64.tar.gz -C binaries/amd64/
          chmod +x binaries/amd64/CFnat
          ls -lh binaries/amd64/CFnat
          file binaries/amd64/CFnat

      - name: 下载 arm64 二进制
        run: |
          mkdir -p binaries/arm64
          curl -fSL -o cfnat_arm64.tar.gz \
            "https://github.com/${{ env.UPSTREAM_REPO }}/releases/download/${{ steps.release.outputs.tag }}/CFnat_linux_arm64.tar.gz"
          tar xzf cfnat_arm64.tar.gz -C binaries/arm64/
          chmod +x binaries/arm64/CFnat
          ls -lh binaries/arm64/CFnat
          file binaries/arm64/CFnat

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || inputs.push_latest == true }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
